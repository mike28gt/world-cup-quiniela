spring:
  application:
    name: world-cup-quiniela
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quiniela}
    username: ${DB_USER:quiniela}
    password: ${DB_PASSWORD:quiniela}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-change-me-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
